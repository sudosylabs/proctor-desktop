name: Foundation

on:
  pull_request:
  push:
    branches: [main]
  # Advisories appear without a commit, so the whole workflow also runs weekly.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use exact npm
        run: npm install --global npm@11.19.0 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - name: Install locked dependencies
        run: npm ci
      - name: Audit npm vulnerabilities
        run: npm run audit:dependencies
      - name: Verify foundation
        run: npm run check
      - name: Verify sandboxed Chromium renderer
        run: |
          npm run setup
          xvfb-run --auto-servernum npm run test:browser
          xvfb-run --auto-servernum npm run test:window-skeleton

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install exact cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native

  native-targets:
    name: native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 and x64, and Windows x64, are the initial certification targets. Linux runs
          # the native gate only; its Electron tests need the virtual display of the foundation job.
          - os: macos-14
            electron: true
          - os: macos-15-intel
            electron: true
          - os: windows-latest
            electron: true
          - os: ubuntu-latest
            electron: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use exact npm
        run: npm install --global npm@11.19.0 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - name: Install locked dependencies
        run: npm ci
      - name: Verify native target
        run: npm run test:native
        env:
          # The runner's clipboard is disposable, so the real clipboard write test runs here.
          PRCTR_ALLOW_CLIPBOARD_WRITE: '1'
      - name: Prepare pinned Electron runtime
        if: matrix.electron
        run: npm run setup
      - name: Verify Electron security utility
        if: matrix.electron
        run: npm run test:electron
