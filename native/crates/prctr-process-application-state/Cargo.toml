[package]
name = "prctr-process-application-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prctr-native-protocol = { path = "../prctr-native-protocol" }
prctr-native-source-runtime = { path = "../prctr-native-source-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Time"] }

[lints]
workspace = true
