[package]
name = "prctr-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGGeometry", "CGWindow", "libc", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "std"] }

[lints]
workspace = true
