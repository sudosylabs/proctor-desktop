[package]
name = "prctr-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["SMAppService", "objc2", "objc2-foundation", "std"] }
endpoint-sec-sys = { version = "=0.6.2", default-features = false, features = ["macos_13_0_0", "objc2"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
libc = { version = "=0.2.189" }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSPasteboard", "std"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2", "std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFData", "CFURL", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGGeometry", "CGSession", "CGWindow", "libc", "std"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2", "objc2-core-video", "std"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "bitflags", "objc2", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSError", "NSString", "std"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["libc", "std"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "std"] }
objc2-security = { version = "=0.3.2", default-features = false, features = ["CSCommon", "SecCode", "SecRequirement", "SecStaticCode", "std"] }
objc2-system-configuration = { version = "=0.3.2", default-features = false, features = ["SCDynamicStore", "SCDynamicStoreCopySpecific", "SCSchemaDefinitions", "std"] }
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = ["VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession", "block2", "objc2", "objc2-core-media", "objc2-core-video", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.189" }

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = { version = "=2.4.8", default-features = false }
windows = { version = "=0.62.2", default-features = false, features = ["Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_Foundation", "Win32_Globalization", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Diagnostics_Etw", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_Rras", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WindowsProgramming", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "std"] }

[lints]
workspace = true
