[package]
name = "prctr-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.189" }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSPasteboard", "std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGGeometry", "CGSession", "CGWindow", "libc", "std"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["libc", "std"] }
objc2-system-configuration = { version = "=0.3.2", default-features = false, features = ["SCDynamicStore", "SCDynamicStoreCopySpecific", "SCSchemaDefinitions", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.189" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_Rras", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "std"] }

[lints]
workspace = true
