[package]
name = "prctr-network-configuration-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prctr-native-protocol = { path = "../prctr-native-protocol" }
prctr-native-source-runtime = { path = "../prctr-native-source-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.189" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinHttp", "Win32_Networking_WinSock"] }

[lints]
workspace = true
