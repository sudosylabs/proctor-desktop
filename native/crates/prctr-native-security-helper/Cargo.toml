[package]
name = "prctr-native-security-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prctr-native-helper-protocol = { path = "../prctr-native-helper-protocol" }
prctr-native-protocol = { path = "../prctr-native-protocol" }
serde = "=1.0.229"
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
prctr-process-application-state = { path = "../prctr-process-application-state" }

[target.'cfg(target_os = "windows")'.dependencies]
prctr-native-source-runtime = { path = "../prctr-native-source-runtime" }
prctr-interactive-session-state = { path = "../prctr-interactive-session-state" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Services", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_System_Com"] }

[lints]
workspace = true

[[bin]]
name = "prctr-native-security-helper"
path = "src/main.rs"
