[workspace]
members = [
  "crates/desktop-key-custody",
  "crates/prctr-protocol",
  "crates/prctr-core",
  "crates/prctr-xtask",
  "crates/prctr-agent",
  "crates/prctr-os",
  "crates/prctr-capabilities",
  "crates/prctr-recorder",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
