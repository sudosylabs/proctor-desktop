[workspace]
members = [
  "crates/prctr-desktop-key-custody",
  "crates/prctr-native-protocol",
  "crates/prctr-native-source-runtime",
  "crates/prctr-native-helper-protocol",
  "crates/prctr-native-security-helper",
  "crates/prctr-display-topology",
  "crates/prctr-candidate-window-state",
  "crates/prctr-capture-session-state",
  "crates/prctr-process-application-state",
  "crates/prctr-interactive-session-state",
  "crates/prctr-clipboard-state",
  "crates/prctr-print-spooler-state",
  "crates/prctr-removable-storage-state",
  "crates/prctr-virtualization-state",
  "crates/prctr-network-configuration-state",
  "crates/prctr-media-device-state",
  "crates/prctr-native-source-supervisor",
  "crates/prctr-native-node-bridge",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
