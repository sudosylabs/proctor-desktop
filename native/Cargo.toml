[workspace]
members = [
  "crates/desktop-key-custody",
  "crates/native-protocol",
  "crates/native-source-runtime",
  "crates/native-helper-protocol",
  "crates/native-security-helper",
  "crates/display-topology",
  "crates/candidate-window-state",
  "crates/capture-session-state",
  "crates/process-application-state",
  "crates/interactive-session-state",
  "crates/clipboard-state",
  "crates/print-spooler-state",
  "crates/removable-storage-state",
  "crates/virtualization-state",
  "crates/network-configuration-state",
  "crates/media-device-state",
  "crates/native-source-supervisor",
  "crates/native-node-bridge",
  "crates/prctr-protocol",
  "crates/prctr-core",
  "crates/prctr-xtask",
  "crates/prctr-agent",
  "crates/prctr-os",
  "crates/prctr-capabilities",
  "crates/prctr-recorder",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
